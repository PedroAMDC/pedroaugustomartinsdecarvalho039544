# ========================
# Application
# ========================
quarkus.application.name=artistas-albuns-api
quarkus.application.version=1.0.0

# ========================
# HTTP Server
# ========================
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# ========================
# CORS Configuration
# ========================
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=x-ratelimit-limit,x-ratelimit-remaining,x-ratelimit-reset
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# ========================
# Database - PostgreSQL
# ========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/artistas_albuns}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:postgres123}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5

# ========================
# Hibernate ORM
# ========================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ========================
# Flyway Migration
# ========================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=true

# ========================
# JWT Security
# ========================
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:artistas-albuns-api}
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.lifespan=${JWT_EXPIRATION_SECONDS:300}
smallrye.jwt.new-token.issuer=${JWT_ISSUER:artistas-albuns-api}

# Custom JWT properties
jwt.refresh.expiration.seconds=${JWT_REFRESH_EXPIRATION_SECONDS:86400}

# ========================
# OpenAPI / Swagger
# ========================
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Artistas e Álbuns API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST para gerenciamento de Artistas e Álbuns - Processo Seletivo Simplificado nº 001/2026/SEPLAG
quarkus.smallrye-openapi.info-contact-name=Pedro Augusto Martins de Carvalho
quarkus.smallrye-openapi.info-license-name=MIT
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=BearerAuth
quarkus.smallrye-openapi.security-scheme-description=JWT Bearer token authentication. Obtain a token via POST /v1/auth/login
quarkus.smallrye-openapi.jwt-security-scheme-value=bearer
quarkus.smallrye-openapi.jwt-bearer-format=JWT

# ========================
# Health Check
# ========================

# ========================
# MinIO Configuration
# ========================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket=${MINIO_BUCKET:albuns-capas}
minio.presigned-url-expiry-seconds=${MINIO_PRESIGNED_URL_EXPIRY:1800}

# ========================
# Rate Limiting
# ========================
rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:10}

# ========================
# WebSocket Configuration
# ========================
quarkus.websockets-next.server.supported-subprotocols=bearer-token-carrier

# ========================
# External API (Regionais) - REST Client
# ========================
quarkus.rest-client.regional-api.url=${REGIONAL_API_URL:https://integrador-argus-api.geia.vip}

# ========================
# Logging
# ========================
quarkus.log.level=INFO
quarkus.log.category."com.artistas".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# ========================
# Dev Profile
# ========================
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.category."com.artistas".level=DEBUG

# ========================
# Test Profile
# ========================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.flyway.migrate-at-start=true
