quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false

mp.jwt.verify.publickey.location=publicKey.example.pem
mp.jwt.verify.issuer=artistas-albuns-api
smallrye.jwt.sign.key.location=privateKey.example.pem
smallrye.jwt.new-token.lifespan=300
smallrye.jwt.new-token.issuer=artistas-albuns-api
jwt.refresh.expiration.seconds=86400
