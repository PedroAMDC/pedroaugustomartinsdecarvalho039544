version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: artistas-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artistas_albuns}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-artistas_albuns}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artistas-network-dev

  minio:
    image: minio/minio:latest
    container_name: artistas-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - artistas-network-dev

  minio-setup:
    image: minio/mc:latest
    container_name: artistas-minio-setup-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb myminio/${MINIO_BUCKET:-albuns-capas} --ignore-existing;
      mc anonymous set download myminio/${MINIO_BUCKET:-albuns-capas};
      exit 0;
      "
    networks:
      - artistas-network-dev

  backend:
    image: maven:3.9-eclipse-temurin-21
    container_name: artistas-backend-dev
    working_dir: /app
    command: ./mvnw quarkus:dev -Dquarkus.http.host=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-artistas_albuns}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-albuns-capas}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production-min-256-bits}
      JWT_ISSUER: ${JWT_ISSUER:-artistas-albuns-api}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-300}
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    networks:
      - artistas-network-dev

  frontend:
    image: node:22-alpine
    container_name: artistas-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - node_modules_cache:/app/node_modules
    networks:
      - artistas-network-dev

networks:
  artistas-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
  minio_data_dev:
    driver: local
  maven_cache:
    driver: local
  node_modules_cache:
    driver: local
